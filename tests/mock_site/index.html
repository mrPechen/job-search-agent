<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Mock Job Site</title>
</head>
<body>
  <h1>Вакансия: Python разработчик</h1>
  <p>Требования: Python, FastAPI, PostgreSQL.</p>
  <a id="apply-btn" data-qa="vacancy-response-submit">Откликнуться</a>
  <div id="apply-form">
    <textarea id="cover-letter" data-qa="cover-letter"></textarea>
    <button id="submit-application" data-qa="submit-application">Отправить отклик</button>
    <div id="apply-log"></div>
  </div>
  <hr>
  <textarea id="chat-input" data-qa="chat_input"></textarea>
  <button id="send-btn" data-qa="chat_send_button">Отправить</button>
  <div id="chat-log"></div>
  <script>
    const input = document.getElementById("chat-input");
    const log = document.getElementById("chat-log");
    const send = document.getElementById("send-btn");
    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      const div = document.createElement("div");
      div.className = "chat-message";
      div.textContent = text;
      log.appendChild(div);
      input.value = "";
    }
    send.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Фиксация отклика: копируем сопроводительное письмо в apply-log
    const submit = document.getElementById("submit-application");
    const cover = document.getElementById("cover-letter");
    const applyLog = document.getElementById("apply-log");
    submit.addEventListener("click", () => {
      applyLog.textContent = cover.value;
    });
  </script>
</body>
</html>
