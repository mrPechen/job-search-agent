[project]
name = "job-search-agent"
version = "0.1.0"
description = "AI-агент поиска работы"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30.0",
    "alembic>=1.19.1",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.0",
    "playwright>=1.62.0",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.2.0",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
target-version = ["py312"]
